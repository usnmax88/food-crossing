<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Food Rush</title>
    <link rel="preload" as="image" href="loading/cover-pixel.png">
    <script>
      {
        const address = new URLSearchParams(location.search), look = address.get("look");
        // the first cartoon look (&grade=8, Scripts/Ink.cs First) keeps the regular interface and cover
        document.documentElement.classList.toggle("cartoon", look === "cartoon" && address.get("grade") !== "8");
        document.documentElement.classList.toggle("diner", look === "diner");
        // the pixel look is the one the game ships in (Scripts/Pixel.cs): what opens with no look in the address
        document.documentElement.classList.toggle("pixel", look === null || look === "pixel");
      }
    </script>
    <style>
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #fadbb8;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      }
      /* Full screen on a phone; a phone-shaped 9:16 box on a wide screen. */
      #unity-canvas, #loading {
        position: fixed; top: 0; left: 50%; transform: translateX(-50%);
        width: 100vw; height: 100vh; height: 100dvh;
        max-width: 56.25vh; max-width: 56.25dvh;
      }
      #unity-canvas { touch-action: none; outline: none; background: #fadbb8; }
      /* While the game loads: the HOTLINE cover (Design/mockups/linehell/i28_loading_ribbon_tall.png: the ribbon logo,
         the chili, milk and basil, and below them a plain counter as tall as a phone) pinned to the top, and on its
         counter the loading line from Design/mockups/linehell/i24_load_bar.png without its flame: a screwed steel plate
         (cut from that picture, its channel emptied) whose channel fills glossy red. */
      #loading {
        background: #9a7e7d url("loading/cover.webp") center top / cover no-repeat;
        pointer-events: none; transition: opacity 0.35s;
      }
      #loading.done { opacity: 0; }
      #loader { position: absolute; left: 9%; right: 9%; bottom: calc(6% + env(safe-area-inset-bottom)); }
      #loader .plate {
        position: relative; aspect-ratio: 1266 / 279; background: url("loading/plate.webp") center / 100% 100%;
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.35));
      }
      /* the painted channel's inside, measured on plate.webp */
      #loader .groove { position: absolute; left: 6.5%; right: 6.4%; top: 26.2%; bottom: 25.4%; }
      #loader .fill {
        position: absolute; left: 3px; top: 3px; bottom: 3px; width: calc((100% - 6px) * var(--done, 0)); min-width: 12px;
        border-radius: 5px; background: linear-gradient(#ee4034, #d62419 55%, #b5150e);
        box-shadow: inset 0 -2px 3px rgba(0, 0, 0, 0.25); transition: width 0.25s ease-out;
      }
      #loader .fill::before {
        content: ""; position: absolute; left: 6px; right: 6px; top: 14%; height: 28%; border-radius: 99px;
        background: linear-gradient(rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.15));
      }
      #loader .error {
        display: none; margin-top: 12px; padding: 8px 12px; border-radius: 8px; background: rgba(43, 46, 51, 0.9);
        font: 600 14px -apple-system, system-ui, sans-serif; color: #fff; text-align: center;
      }
      html.cartoon, html.cartoon body { background: #ded8e7; }
      html.cartoon #unity-canvas { background: #ded8e7; }
      html.cartoon #loading { background: #cdd0db url("loading/cover-cartoon.webp") center top / cover no-repeat; }
      html.cartoon #loader .plate {
        background-image: url("loading/plate-cartoon.webp");
        filter: drop-shadow(3px 5px 0 rgba(14, 13, 19, 0.45));
      }
      html.cartoon #loader .fill {
        left: 4px; top: 4px; bottom: 4px; min-width: 10px;
        border: 2px solid #0e0d13; border-radius: 3px;
        background: #e52e20; box-shadow: none;
      }
      html.cartoon #loader .fill::before { display: none; }
      /* the diner look (Scripts/Diner.cs): the cover and plate in its matte blue-grey paint, a plum-brown line round
         the red fill over a soft lavender shadow */
      html.diner, html.diner body { background: #e9dcc8; }
      html.diner #unity-canvas { background: #e9dcc8; }
      html.diner #loading { background: #b9c3d3 url("loading/cover-diner.webp") center top / cover no-repeat; }
      html.diner #loader .plate {
        background-image: url("loading/plate-diner.webp");
        filter: drop-shadow(0 6px 8px rgba(61, 36, 87, 0.4));
      }
      html.diner #loader .fill {
        border: 1.5px solid #29141a; background: linear-gradient(#f2483b, #dc2a1d 55%, #bb1a12);
      }
      /* the pixel look (Scripts/Pixel.cs), the one the game ships in: the first cover's scene and logo as pixel art,
         the chili and two friends running at us down the kitchen's steel counter under the ribbon, which reads FOOD
         RUSH; the counter in front of them plain for the loading line, a cream key whose dark channel fills red
         (Art/pixel_cover.py makes both, four screen pixels to each of their own) */
      html.pixel, html.pixel body { background: #24223e; }
      html.pixel #unity-canvas { background: #24223e; }
      html.pixel #loading {
        background: #425a84 url("loading/cover-pixel.png") center top / cover no-repeat; image-rendering: pixelated;
      }
      html.pixel #loader .plate {
        aspect-ratio: 216 / 26; background-image: url("loading/plate-pixel.png"); image-rendering: pixelated;
        filter: drop-shadow(0 4px 0 rgba(44, 52, 110, 0.3));
      }
      /* the channel's inside, in the plate's own pixels: 7 in from either end, 6 down, 10 up */
      html.pixel #loader .groove { left: 3.24%; right: 3.24%; top: 23.08%; bottom: 38.46%; }
      html.pixel #loader .fill {
        left: 0; top: 0; bottom: 0; width: calc(100% * var(--done, 0)); min-width: 0;
        border-radius: 0; box-shadow: none;
        background: linear-gradient(#ff8474 0 25%, #d82436 25% 75%, #98103c 75%);
      }
      html.pixel #loader .fill::before { display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div id="loader">
        <div class="plate"><div class="groove"><div class="fill"></div></div></div>
        <div class="error"></div>
      </div>
    </div>
    <script src="Build/ed73d71b41c7d190294e541f080f5f45.loader.js"></script>
    <script>
      const loading = document.querySelector("#loading");
      const fill = loading.querySelector(".fill");
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/5b59f0f6ca8b6078c97d76e4be87ad4c.data.unityweb",
        frameworkUrl: "Build/d25ba467e7a56ff6ad92506c6c01d2e2.framework.js.unityweb",
        codeUrl: "Build/cd26d2c71127d8ed824b6ff63798c7b4.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Food Rush",
        productVersion: "0.1.0",
        devicePixelRatio: window.devicePixelRatio || 1,  // every pixel the phone has
      }, (progress) => {
        fill.style.setProperty("--done", progress);
      }).then(() => {
        fill.style.setProperty("--done", 1);
        loading.classList.add("done");
        setTimeout(() => loading.remove(), 400);
      }).catch((message) => {
        const error = loading.querySelector(".error");
        error.textContent = message;
        error.style.display = "block";
      });
    </script>
  </body>
</html>
