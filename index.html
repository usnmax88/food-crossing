<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Food Crossing</title>
    <link rel="preload" as="image" href="loading/cover.webp">
    <style>
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #fadbb8;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      }
      /* Full screen on a phone; a phone-shaped 9:16 box on a wide screen. */
      #unity-canvas, #loading {
        position: fixed; top: 0; left: 50%; transform: translateX(-50%);
        width: 100vw; height: 100vh; height: 100dvh;
        max-width: 56.25vh; max-width: 56.25dvh;
      }
      #unity-canvas { touch-action: none; outline: none; background: #fadbb8; }
      /* While the game loads: the HOTLINE cover (Design/mockups/linehell/i28_loading_ribbon_tall.png: the ribbon logo,
         the chili, milk and basil, and below them a plain counter as tall as a phone) pinned to the top, and on its
         counter the loading line from Design/mockups/linehell/i24_load_bar.png: a screwed steel plate (cut from that
         picture, its channel emptied) whose channel fills glossy red, a blue gas flame riding the tip of the red. */
      #loading {
        background: #9a7e7d url("loading/cover.webp") center top / cover no-repeat;
        pointer-events: none; transition: opacity 0.35s;
      }
      #loading.done { opacity: 0; }
      #loader { position: absolute; left: 9%; right: 9%; bottom: calc(6% + env(safe-area-inset-bottom)); }
      #loader .plate {
        position: relative; aspect-ratio: 1266 / 279; background: url("loading/plate.webp") center / 100% 100%;
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.35));
      }
      /* the painted channel's inside, measured on plate.webp */
      #loader .groove { position: absolute; left: 6.5%; right: 6.4%; top: 26.2%; bottom: 25.4%; }
      #loader .fill {
        position: absolute; left: 3px; top: 3px; bottom: 3px; width: 0; min-width: 12px;
        border-radius: 5px; background: linear-gradient(#ee4034, #d62419 55%, #b5150e);
        box-shadow: inset 0 -2px 3px rgba(0, 0, 0, 0.25); transition: width 0.25s ease-out;
      }
      #loader .fill::before {
        content: ""; position: absolute; left: 6px; right: 6px; top: 14%; height: 28%; border-radius: 99px;
        background: linear-gradient(rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.15));
      }
      #loader .flame {
        position: absolute; right: 0; bottom: -4%; height: 165%; aspect-ratio: 48 / 64; transform: translateX(42%);
        filter: drop-shadow(0 0 5px rgba(80, 160, 255, 0.9));
      }
      #loader .error {
        display: none; margin-top: 12px; padding: 8px 12px; border-radius: 8px; background: rgba(43, 46, 51, 0.9);
        font: 600 14px -apple-system, system-ui, sans-serif; color: #fff; text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div id="loader">
        <div class="plate"><div class="groove"><div class="fill">
          <svg class="flame" viewBox="0 0 48 64" aria-hidden="true">
            <defs>
              <radialGradient id="flame-outer" cx="50%" cy="78%" r="72%">
                <stop offset="0" stop-color="#e8f6ff"/><stop offset="0.35" stop-color="#7cc4ff"/>
                <stop offset="0.75" stop-color="#2f7dff"/><stop offset="1" stop-color="#1c4fd8"/>
              </radialGradient>
              <radialGradient id="flame-inner" cx="50%" cy="85%" r="70%">
                <stop offset="0" stop-color="#fff"/><stop offset="0.6" stop-color="#d6efff"/><stop offset="1" stop-color="#8fd0ff"/>
              </radialGradient>
            </defs>
            <!-- three tongues, the middle one tallest, and a pale core -->
            <path fill="url(#flame-outer)" d="M24 2C27 12 31 16 33 22C36 17 38 14 39 10C43 20 46 30 46 40C46 54 36 62 24 62C12 62 2 54 2 41C2 31 6 22 10 15C11 20 13 23 15 25C16 16 20 9 24 2Z"/>
            <path fill="url(#flame-inner)" d="M24 24C26 31 31 35 32 43C33 51 29 57 24 57C19 57 15 52 16 45C16 40 19 36 20 31C21 35 22 36 23 37C22 32 22 28 24 24Z"/>
          </svg>
        </div></div></div>
        <div class="error"></div>
      </div>
    </div>
    <script src="Build/cd41feca11b4921d4dc141eb3be182bd.loader.js"></script>
    <script>
      const loading = document.querySelector("#loading");
      const fill = loading.querySelector(".fill");
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/232826c162fed4894a229896fe244d3f.data.unityweb",
        frameworkUrl: "Build/d25ba467e7a56ff6ad92506c6c01d2e2.framework.js.unityweb",
        codeUrl: "Build/34287a512e300126aeb94579211a2874.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Food Crossing",
        productVersion: "0.1.0",
        devicePixelRatio: window.devicePixelRatio || 1,  // every pixel the phone has
      }, (progress) => {
        fill.style.width = "calc((100% - 6px) * " + progress + ")";
      }).then(() => {
        fill.style.width = "calc(100% - 6px)";
        loading.classList.add("done");
        setTimeout(() => loading.remove(), 400);
      }).catch((message) => {
        const error = loading.querySelector(".error");
        error.textContent = message;
        error.style.display = "block";
      });
    </script>
  </body>
</html>
